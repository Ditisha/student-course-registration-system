# PostgreSQL. Create the database first:  CREATE DATABASE course_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/course_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# 8081 so it does not clash with the Employee Management app on 8080
server.port=8081
